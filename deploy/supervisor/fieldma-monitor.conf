[program:fieldma-polling-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fieldma-monitor/artisan queue:work redis --queue=polling,default --sleep=1 --tries=1 --max-time=3600
directory=/var/www/fieldma-monitor
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=10
redirect_stderr=true
stdout_logfile=/var/www/fieldma-monitor/storage/logs/worker.log
stopwaitsecs=30

[program:fieldma-reverb]
process_name=%(program_name)s
command=php /var/www/fieldma-monitor/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/fieldma-monitor
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/fieldma-monitor/storage/logs/reverb.log
stopwaitsecs=15
