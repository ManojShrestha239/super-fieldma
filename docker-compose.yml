services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fieldma_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fieldma_central
      DB_USERNAME: fieldma
      DB_PASSWORD: fieldma_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fieldma_net

  nginx:
    image: nginx:1.27-alpine
    container_name: fieldma_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - fieldma_net

  vite:
    image: node:22-alpine
    container_name: fieldma_vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks:
      - fieldma_net

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fieldma_reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fieldma_central
      DB_USERNAME: fieldma
      DB_PASSWORD: fieldma_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fieldma_net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=polling,default --sleep=1 --tries=1 --max-time=3600
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fieldma_central
      DB_USERNAME: fieldma
      DB_PASSWORD: fieldma_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - fieldma_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fieldma_scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fieldma_central
      DB_USERNAME: fieldma
      DB_PASSWORD: fieldma_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fieldma_net

  mysql:
    image: mysql:8.4
    container_name: fieldma_mysql
    ports:
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: fieldma_central
      MYSQL_USER: fieldma
      MYSQL_PASSWORD: fieldma_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - fieldma_net

  redis:
    image: redis:7-alpine
    container_name: fieldma_redis
    ports:
      - "63791:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fieldma_net

  mock-remote-db:
    image: mysql:8.4
    container_name: fieldma_mock_remote_db
    ports:
      - "33062:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mock_root_secret
    volumes:
      - ./docker/mock-remote-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmock_root_secret"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - fieldma_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fieldma_phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOSTS: mysql,mock-remote-db
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fieldma_net

volumes:
  mysql_data:

networks:
  fieldma_net:
    driver: bridge
